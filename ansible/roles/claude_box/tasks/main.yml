# ==== claude-box: the PROJECT-AGNOSTIC half of the deployment ====
#
# Everything here is true for ANY claude-box stack: the directory layout, the rsync of the source
# tree, the uid-1000 data dirs, the rendered hub mounts, the `.env` symlink and the GitHub deploy
# key. Anything that knows what the project IS — the compose env file, `mounts`, `service-env`,
# `port-forwards`, the hub-service manifests, seed data — is the CALLER's, and reaches this role as
# `claude_box_config_files` (see defaults/main.yml).
#
# Tags are on the individual tasks rather than on the role, because the whole deploy workflow here is
# tag-driven (`--tags containers-claude-box-files`, `containers-claude-box-deploy-key`). That only
# works because the caller uses `import_role` (STATIC): tags do not propagate into an `include_role`.

- name: Create claude-box container config
  file: path={{ item }} state=directory owner=root group=root mode="u=rwx,g=rx,o=rx"
  with_items:
    - "{{ claude_box_dir }}/"

- name: Sync files for compose
  synchronize:
    # Absolute (see claude_box_source in defaults/main.yml) — `synchronize` looks a relative src up in
    # the ROLE's files/ dir first, which is not where the stack sources live.
    src: "{{ claude_box_source }}"
    dest: "{{ claude_box_dir }}/"
    recursive: yes
    archive: no
    links: yes
    perms: yes
    rsync_opts:
      - "--exclude=.*.swp"
      # Generated on the HOST from `mounts` (see below) — never ship a developer's local copy.
      - "--exclude=compose.override.yml"
  tags: [containers-claude-box-files]

# Take care of setting special permissions: boxes + hub run as uid 1000. data/ itself plus every
# subdir in claude_box_data_dirs (the stack's own plumbing; a project adds its caches to that list).
- name: Take care of special permissions
  file: path={{ item }} state=directory owner={{ claude_box_uid }} group=root mode="u=rwx,g=rx,o="
  with_items: "{{ [claude_box_dir ~ '/data/'] + (claude_box_data_dirs | map('regex_replace', '^', claude_box_dir ~ '/data/') | list) }}"
  tags: [containers-claude-box-files]

# GitHub deploy key + the hub's gitconfig live here. Created before the config files below so a
# caller can template its gitconfig straight into it.
- name: Ensure git-identity directory exists (holds the deploy key + the hub's gitconfig)
  file: path={{ claude_box_dir }}/git-identity/ state=directory owner={{ claude_box_uid }} group=root mode="u=rwx,g=,o="
  tags: [containers-claude-box-files, containers-claude-box-deploy-key]

# The project's config files (compose env, mounts, service-env, port-forwards, hub gitconfig, …).
# The role does not know or care what they are — only that they must exist before gen-hub-mounts.sh
# runs and before the `.env` symlink is followed. `src` is ABSOLUTE; see the note in defaults.
- name: Template the project's claude-box config files
  template:
    src: "{{ item.src }}"
    dest: "{{ claude_box_dir }}/{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('u=rw,g=r,o=r') }}"
    backup: no
  loop: "{{ claude_box_config_files }}"
  loop_control:
    label: "{{ item.dest }}"
  tags: [containers-claude-box-files]

# The broker reads the box column of the `mounts` table directly, but compose cannot read it — so the
# hub's column is rendered into compose.override.yml here. Skipping this is what would let the hub's
# mounts drift from the boxes'; the hub warns at boot if they have. Needs `mounts` to exist, i.e. the
# caller must have templated it above.
- name: Render the hub's volumes from the mounts table
  command: ./gen-hub-mounts.sh
  args:
    chdir: "{{ claude_box_dir }}"
  changed_when: false
  tags: [containers-claude-box-files]

# `.env` is a symlink to the templated compose env file (which holds the vault-backed values), so
# `docker compose` picks it up automatically from the project dir. A symlink rather than a second
# copy: one file to review, and no way for the two to drift.
- name: Symlink .env to the compose env file so docker compose picks it up
  file: path={{ claude_box_dir }}/.env src={{ claude_box_env_file }} state=link force=yes
  tags: [containers-claude-box-files]

# Superseded by `mounts` (box-only, and hub-writable via the removed `cbx expose`).
- name: Remove the superseded box-mounts manifest
  file: path={{ claude_box_dir }}/box-mounts state=absent
  tags: [containers-claude-box-files]

# GitHub deploy key
# Generate an SSH keypair on the remote (never checked into git) that can be
# registered as a GitHub deploy key for the repo the hub clones on first boot.
- name: Generate GitHub deploy key on the remote
  command: >
    ssh-keygen -t ed25519 -N ''
    -C '{{ claude_box_deploy_key_comment }}'
    -f {{ claude_box_dir }}/git-identity/id_ed25519
  args:
    creates: "{{ claude_box_dir }}/git-identity/id_ed25519"
  tags: [containers-claude-box-deploy-key]
- name: Fix ownership/permissions on the deploy key
  file: path={{ item.path }} owner={{ claude_box_uid }} group=root mode={{ item.mode }}
  with_items:
    - { path: "{{ claude_box_dir }}/git-identity/id_ed25519", mode: "u=rw,g=,o=" }
    - { path: "{{ claude_box_dir }}/git-identity/id_ed25519.pub", mode: "u=rw,g=r,o=r" }
  tags: [containers-claude-box-deploy-key]
- name: Read the deploy public key
  slurp:
    src: "{{ claude_box_dir }}/git-identity/id_ed25519.pub"
  register: claude_box_deploy_pubkey
  tags: [containers-claude-box-deploy-key]
- name: Show the deploy public key and how to register it on GitHub
  # msg is a list so the default stdout callback prints one line per element
  # (a single multi-line string would be shown with literal \n escapes).
  debug:
    msg:
      - "===================== GitHub deploy key ====================="
      - "Copy the public key line below and add it as a deploy key:"
      - ""
      - "  {{ claude_box_deploy_pubkey.content | b64decode | trim }}"
      - ""
      - "How to register it on github.com:"
      - "  1. Open your repository on github.com"
      - "  2. Settings -> Deploy keys -> Add deploy key"
      - "  3. Title:  claude-box @ {{ inventory_hostname }}"
      - "  4. Key:    paste the exact line above (starts with 'ssh-ed25519')"
      - "  5. Tick \"Allow write access\" only if the hub needs to push"
      - "  6. Click \"Add key\""
      - ""
      - "Then use an SSH-form REPO_URL (git@github.com:owner/repo.git) so the"
      - "hub authenticates with this key."
      - ""
      - "----- Protect the default branch (ruleset) -----"
      - "Prevent the deploy key (and everyone else) from pushing to the"
      - "default branch, while still letting the repo owner through:"
      - "  1. Settings -> Rules -> Rulesets -> New branch ruleset"
      - "  2. Name:   protect-default-branch"
      - "  3. Enforcement status:  Active"
      - "  4. Bypass list -> Add bypass -> Repository admin (Role)"
      - "       (or add the owner's account explicitly; org repos only)"
      - "  5. Target branches -> Add target -> Include default branch"
      - "  6. Enable rules:"
      - "       - Restrict updates   (blocks direct pushes)"
      - "       - Restrict deletions"
      - "       - Block force pushes"
      - "       - (optional) Require a pull request before merging"
      - "  7. Create"
      - "The deploy key is not in the bypass list, so it cannot push to the"
      - "default branch; the owner still can."
      - "============================================================="
  tags: [containers-claude-box-deploy-key]
