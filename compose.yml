# Per-project remote muster stack. Copy this directory once per project (each gets its own
# .env, mounts, and ./data), then `./gen-hub-mounts.sh && docker compose up -d`.
#
# THIS FILE IS THE STACK, NOT YOUR PROJECT. It defines only the two containers muster itself is
# made of — the hub and the box-broker. Anything your project needs beside them (a database, a
# message broker, a cache, seed data) belongs in `compose.project.yml`: copy
# compose.project.yml.example and merge it via COMPOSE_FILE in .env, e.g.
#     COMPOSE_FILE=compose.yml:compose.project.yml:compose.override.yml
# Note the third entry: setting COMPOSE_FILE at all DISABLES compose's automatic loading of
# compose.override.yml, which is where gen-hub-mounts.sh renders the hub's half of the `mounts`
# table — omit it and the hub silently loses every project mount.
#
# Image defaults here are REGISTRY-NEUTRAL plain tags (muster-hub:stable, …), i.e. whatever the
# local docker daemon has — which is what you want when the images are built on the same host (the
# Jenkinsfile tags them exactly like this). To run on a different host, point HUB_IMAGE /
# BOX_BROKER_IMAGE / BOX_IMAGE / HUB_BASE_IMAGE at registry-qualified names in .env and set
# COMPOSE_PULL_POLICY=always (`docker login <registry>` must have run on that host). To build hub +
# box-broker from this directory instead, set COMPOSE_PULL_POLICY=build.
#
# Model: the hub owns the checkout and runs the dev services on demand (cbx up backend|frontend|
# pinchtab). Agent boxes are SEPARATE muster containers spawned by the box-broker (the only
# holder of the docker socket); they mount only what the `mounts` table grants and reach the hub
# by name.

name: ${PROJECT_NAME}

networks:
  default:
    name: cbx-${PROJECT_NAME}

services:
  # The ONLY container with the docker socket. "muster-box.sh as a service": validates the request
  # (the hub passes a box NAME; the mounts come from the root-owned `mounts` table) then runs the
  # modified muster-box.sh.
  box-broker:
    # Whatever the local daemon has by default (COMPOSE_PULL_POLICY=missing). Point
    # BOX_BROKER_IMAGE at a registry-qualified name to pull it from elsewhere, or set
    # COMPOSE_PULL_POLICY=build to (re)build locally from this dir.
    image: ${BOX_BROKER_IMAGE:-muster-broker:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN}
      PROJECT_NAME: ${PROJECT_NAME}
      BOX_IMAGE: ${BOX_IMAGE:-muster:stable}
      # How every box's claude comes up — project policy, not something you retype per box.
      #   MUSTER_CLAUDE_PERMISSION_MODE  claude's --permission-mode, passed through verbatim:
      #                      default | plan | acceptEdits | bypassPermissions | auto. Named for the
      #                      harness because the levels are claude's, not muster's.
      #   MUSTER_BOX_PROMPT  an opening message. $VARIABLES are filled from the broker's own environment
      #                      plus this box's facts: $MUSTER_BOX, $MUSTER_BRANCH, $MUSTER_DEV_BRANCH,
      #                      $MUSTER_BASE_BRANCH, $MUSTER_MERGE_BRANCH, $MUSTER_PROJECT, $MUSTER_WORKDIR,
      #                      $MUSTER_GOLDEN. Unknown names are left alone.
      MUSTER_CLAUDE_PERMISSION_MODE: ${MUSTER_CLAUDE_PERMISSION_MODE:-}
      MUSTER_BOX_PROMPT: ${MUSTER_BOX_PROMPT:-}
      BOX_NETWORK: cbx-${PROJECT_NAME}
      # The prepared "golden" checkouts every box overlays (data/golden/current), and the staging dir
      # the hub prepares a new one in before the broker seals it into place. PROJECT_ROOT confines
      # golden-relative sources in the mounts table; the checkout itself is the overlay volume.
      GOLDEN_DIR: ${STACK_DIR}/data/golden
      GOLDEN_STAGING: ${STACK_DIR}/data/golden-staging
      PROJECT_ROOT: ${STACK_DIR}/data/golden
      # SAME absolute path as the hub's own repo, deliberately: installed dependencies bake absolute
      # paths in (npm's node_modules/.bin shebangs, project-local .gradle), so a golden prepared on
      # the hub only works in a box if it is mounted back at the path it was prepared at.
      CHECKOUT_DST: /home/dev/repo
      DEV_BRANCH: ${DEV_BRANCH:-dev}
      # The stack's own name for the CLI. The hub symlinks `cbx` to it (see hub/entrypoint.sh) so
      # the command is spelled the same here as it is on your laptop, where `muster_stack <prefix> …`
      # generates the matching family. Empty or 'cbx' = no symlink, nothing changes.
      MUSTER_PREFIX: ${MUSTER_PREFIX:-}
      HUB_GIT_URL: ${HUB_GIT_URL:-git://hub/repo}
      CLAUDE_HOME: ${STACK_DIR}/data/claude
      BOXROOT: ${STACK_DIR}/data/boxes
      # The `mounts` table: ONE row per path with a mode for the hub and a mode for the box, so the two
      # environments cannot drift apart (see mounts.example). The broker reads the box column from
      # here; the hub's column is rendered into compose.override.yml by gen-hub-mounts.sh. STACK_DIR is
      # what a './…' source in that table resolves against.
      STACK_DIR: ${STACK_DIR}
      MOUNTS_FILE: ${STACK_DIR}/mounts
      PINCHTAB_SERVER: http://hub:9867
      PINCHTAB_TOKEN: ${PT_TOKEN}
      # Per-project port forwards (like `mounts`): NAME BOX_PORT HUB_BASE_PORT per line. Each box
      # gets a slot N and every forward is published on the hub at 127.0.0.1:(HUB_BASE_PORT + N).
      # Project/service settings (KEY=VALUE) handed to every box. The hub gets the SAME file via
      # `env_file:` below, so a backend/frontend is configured identically whether the hub or an
      # agent runs it.
      SERVICE_ENV_FILE: ${STACK_DIR}/service-env
      PORT_FORWARDS_FILE: ${STACK_DIR}/port-forwards
      PORT_FORWARD_SLOTS: ${PORT_FORWARD_SLOTS:-16}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # host paths must resolve identically inside the broker so the boxes' -v binds land on the host
      - ${STACK_DIR}:${STACK_DIR}
    restart: unless-stopped

  # The "hosting dev environment": owns the checkout + git identity, runs backend/ng serve/pinchtab
  # on demand, hosts YOUR commit workflow. Does NOT run claude.
  hub:
    # Same policy as box-broker.
    image: ${HUB_IMAGE:-muster-hub:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    hostname: ${PROJECT_NAME}-hub
    init: true
    # Project services (a db, a cache, …) are added to this list by compose.project.yml, which
    # compose merges into it — this file knows only about the stack's own two containers.
    depends_on: [box-broker]
    environment:
      # The hub's own repo: the only clone with origin credentials, the only place dev is merged, and
      # what the boxes fetch/push over git:// (see hub/entrypoint.sh). It is ALSO your setup
      # workspace — `cbx golden snapshot` freezes it as the base every box overlays, at this exact
      # path, so absolute paths baked into installed deps stay valid inside the boxes.
      CHECKOUT: /home/dev/repo
      REPO_URL: ${REPO_URL}
      DEV_BRANCH: ${DEV_BRANCH:-dev}
      HUB_GIT_URL: ${HUB_GIT_URL:-git://hub/repo}
      GOLDEN_DIR: /work/golden
      GOLDEN_STAGING: /work/golden-staging
      # Run by `cbx golden snapshot --prep` IN THE HUB'S REPO (not in a copy), so what it installs is
      # frozen at the path the boxes use it from — put your project's install/warm steps here.
      # Empty by default — muster knows nothing about your build. Set GOLDEN_PREP_CMD in .env
      # (e.g. `npm ci && gradle classes`) to give `cbx golden snapshot --prep` something to run.
      GOLDEN_PREP_CMD: ${GOLDEN_PREP_CMD:-}
      BROKER_URL: http://box-broker:8099
      BROKER_TOKEN: ${BROKER_TOKEN}
      # The mounts table, read-only — the hub does not apply it (compose.override.yml does that), it
      # only CHECKS its own mounts against it at boot, so a stale override or a missed
      # `docker compose up -d hub` shows up as a warning instead of as silent hub/box drift.
      MOUNTS_FILE: /work/mounts
      # Dev-service manifests (one file per service) that `cbx up/svcs/autostart` read — bind-mounted
      # read-only from the stack's ./hub-services below. Changing a service is a file sync, not a rebuild.
      HUB_SERVICES_DIR: /work/hub-services
      GIT_CONFIG_GLOBAL: /home/dev/.gitidentity/gitconfig
      # Keep the WHOLE claude config in the one dir that hub + every box share (./data/claude below,
      # which the broker also mounts into each box as ~/.claude). By default the login and the user
      # preferences live in ~/.claude.json — OUTSIDE ~/.claude — so they would be container-local here
      # and per-box there: recreating the hub or starting a second box asked for the login again.
      CLAUDE_CONFIG_DIR: /home/dev/.claude
    # Everything PROJECT-specific (backend/frontend wiring, API keys) lives in `service-env` instead
    # of here, because the box-broker hands the very same file to every agent box. That is what makes
    # a backend an AGENT starts behave like the one the hub starts. Keep this `environment:` block for
    # stack plumbing only — anything a service reads belongs in service-env.
    env_file:
      - ./service-env
    volumes:
      - ./data/repo:/home/dev/repo
      # Sealed goldens are READ-ONLY here on purpose. It cannot be done with file modes: overlayfs
      # checks write permission on the merged inode BEFORE deciding to copy up, so a non-writable
      # golden would make every file unwritable inside the boxes. The mount is the enforcement; the
      # hub prepares new goldens in the writable staging dir and the broker moves them into place.
      - ./data/golden:/work/golden:ro
      - ./data/golden-staging:/work/golden-staging
      # Per-box state (which golden, session id, upper layer) — readable for `cbx q`/diagnostics only.
      - ./data/boxes:/work/boxes:ro
      - ./mounts:/work/mounts:ro
      # Dev-service manifests (backend/frontend/pinchtab/…), read-only. Copy hub-services.example ->
      # hub-services once (a config-management tool may template it on the server). An empty/absent dir = no services.
      - ./hub-services:/work/hub-services:ro
      - ./data/claude:/home/dev/.claude
      - ./data/pinchtab:/home/dev/.pinchtab
      - ./git-identity:/home/dev/.gitidentity
      # NOTE: the hub's PROJECT mounts (~/.npm, ~/.gradle, ~/.m2/repository — anything a build touches)
      # are NOT listed here. They come from the `mounts` table via compose.override.yml, which
      # gen-hub-mounts.sh renders, so the hub and the boxes cannot be configured differently by
      # accident. What stays here is the stack's own plumbing above: the repo, the goldens, box state,
      # the manifests, the shared claude/pinchtab/git identity.
    restart: unless-stopped

  # ------------------------------------------------------------------ build-only
  #
  # NONE OF THE THREE BELOW IS A SERVICE. They exist to give `docker compose build` one target per
  # image; nothing ever starts them.
  #
  #     docker compose --profile build build          # broker + hub + box
  #
  # `profiles:` is what keeps them out of everything else: a profiled service is invisible to `up`,
  # `down`, `pull`, `ps` and plain `build` unless the profile is switched on. So a deployment that
  # pulls prebuilt images (ours) never touches them, and no `depends_on` can drag one in.
  #
  # Why they are here at all, rather than a `build:` on the hub and broker services themselves: with
  # one, a `docker compose up` whose image is missing — a typo'd tag, a registry that has not been
  # pushed to yet — silently BUILDS instead of failing. On a server that is the worst of both worlds:
  # minutes of surprise work, then a hub running an image nobody published and nobody can reproduce.
  # Without it the same situation is one clear error. A test asserts that no startable service ever
  # grows a `build:` back.

  # The BROKER image. Generic — no project add-on — so a deployment always pulls it from ghcr; this
  # exists only for a fork, an air-gapped site, or anyone who would rather not run our binaries.
  broker-image:
    profiles: [build]
    image: ${BOX_BROKER_IMAGE:-muster-broker:stable}
    build:
      context: .
      dockerfile: box-broker/Dockerfile
    command: ["true"]
    restart: "no"

  # The HUB add-on image: Dockerfile.addon — your project's toolchain, installed by the script
  # SETUP_SCRIPT names — layered onto muster-hub-base (hub/Dockerfile.base). Override HUB_BASE_IMAGE
  # to build against a locally-built or registry-qualified base.
  hub-image:
    profiles: [build]
    image: ${HUB_IMAGE:-muster-hub:stable}
    build:
      context: .
      dockerfile: Dockerfile.addon
      args:
        BASE_IMAGE: ${HUB_BASE_IMAGE:-muster-hub-base:stable}
        # FINAL_USER=1000: the hub runs as its uid-1000 'dev' user, unlike the box, which stays root
        # and drops privileges in its own entrypoint.
        FINAL_USER: "1000"
        SETUP_SCRIPT: ${SETUP_SCRIPT:-build-setup.sh}
        GRADLE_VERSION: ${GRADLE_VERSION:-}
    command: ["true"]
    restart: "no"

  # THE BOX ADD-ON IMAGE — the one image compose otherwise could not build at all: the broker spawns
  # boxes itself and only receives BOX_IMAGE as an environment value, so `docker compose build` used
  # to produce a hub carrying your toolchain and leave the boxes without it. You found out when an
  # agent's first build failed. It is the SAME Dockerfile.addon as the hub, onto the box base instead
  # of the hub base — that is the whole difference between the two add-on images, and why one file
  # serves both.
  box-image:
    profiles: [build]
    image: ${BOX_IMAGE:-muster:stable}
    build:
      context: .
      dockerfile: Dockerfile.addon
      args:
        BASE_IMAGE: ${BOX_BASE_IMAGE:-muster:stable}
        SETUP_SCRIPT: ${SETUP_SCRIPT:-build-setup.sh}
        GRADLE_VERSION: ${GRADLE_VERSION:-}
    # Belt and braces: if some future `--profile build up` ever selects it, it must exit immediately
    # rather than sit there as a second, confusing agent container.
    command: ["true"]
    restart: "no"
