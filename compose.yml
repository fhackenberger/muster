# Per-project remote claude-box stack. Copy this directory once per project (each gets its own
# .env, box-mounts, and ./data), then `docker compose up -d`.
#
# All images are pulled from the acoveo registry (dockerregistry.acoveo.com) by default, so the
# stack does NOT need to run on the same host as Jenkins. The db (dbtest) and the box / hub /
# box-broker images are built + pushed by the Jenkinsfile; here they're referenced by the *_IMAGE
# vars in .env and pulled per COMPOSE_PULL_POLICY (default `missing`). `docker login
# dockerregistry.acoveo.com` must have run on the host. To build hub + box-broker locally instead
# (e.g. on the Jenkins host), set COMPOSE_PULL_POLICY=build.
#
# Model: the hub owns the checkout and runs the dev services on demand (cbx up backend|frontend|
# pinchtab). Agent boxes are SEPARATE claude-box containers spawned by the box-broker (the only
# holder of the docker socket); they mount only what box-mounts grants and reach the hub by name.
#
# Model: the hub owns the checkout and runs the dev services on demand (cbx up backend|frontend|
# pinchtab). Agent boxes are SEPARATE claude-box containers spawned by the box-broker (the only
# holder of the docker socket); they mount only what box-mounts grants and reach the hub by name.

name: ${PROJECT_NAME}

networks:
  default:
    name: cbx-${PROJECT_NAME}

services:
  db:
    image: ${DB_IMAGE:-dockerregistry.acoveo.com/infostars/dbtest:latest}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    restart: unless-stopped

  activemq:
    image: apache/activemq-artemis:latest
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # The ONLY container with the docker socket. "claude-box.sh as a service": validates the request
  # (box name + box-mounts, sources confined under the checkout) then runs the modified claude-box.sh.
  box-broker:
    # Pulled from the acoveo registry if missing (COMPOSE_PULL_POLICY=missing). Set
    # COMPOSE_PULL_POLICY=build to (re)build locally from this dir instead (e.g. on the Jenkins host).
    image: ${BOX_BROKER_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-broker:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: box-broker/Dockerfile
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN}
      PROJECT_NAME: ${PROJECT_NAME}
      BOX_IMAGE: ${BOX_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box:stable}
      BOX_NETWORK: cbx-${PROJECT_NAME}
      PROJECT_ROOT: ${STACK_DIR}/data/checkout
      CLAUDE_HOME: ${STACK_DIR}/data/claude
      BOXROOT: ${STACK_DIR}/data/boxes
      BOX_MOUNTS: ${STACK_DIR}/box-mounts
      PINCHTAB_SERVER: http://hub:9867
      PINCHTAB_TOKEN: ${PT_TOKEN}
      DEV_URL: http://hub:4200
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # host paths must resolve identically inside the broker so the boxes' -v binds land on the host
      - ${STACK_DIR}:${STACK_DIR}
    restart: unless-stopped

  # The "hosting dev environment": owns the checkout + git identity, runs backend/ng serve/pinchtab
  # on demand, hosts YOUR commit workflow. Does NOT run claude.
  hub:
    # Same policy as box-broker: pulled from the acoveo registry if missing
    image: ${HUB_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-hub:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    build:
      context: hub
      # The hub image (Dockerfile) layers the extra infostars build deps (ant) onto the
      # project-agnostic claude-box-hub-base (Dockerfile.base). A local build (COMPOSE_PULL_POLICY=
      # build) resolves the base from the registry by default; point this at a locally-built tag to
      # build fully offline (build Dockerfile.base first — see README-remote.md).
      args:
        HUB_BASE_IMAGE: ${HUB_BASE_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-hub-base:stable}
    hostname: ${PROJECT_NAME}-hub
    init: true
    depends_on: [db, redis, box-broker]
    environment:
      CHECKOUT: /work/checkout
      REPO_URL: ${REPO_URL}
      BROKER_URL: http://box-broker:8099
      BROKER_TOKEN: ${BROKER_TOKEN}
      BOX_MOUNTS: /work/box-mounts
      GIT_CONFIG_GLOBAL: /home/gradle/.gitidentity/gitconfig
      # backend wiring (confirmed keys; env overrides the baked-in config.properties defaults)
      DB_INFOSTARS_PSQL_URL: jdbc:postgresql://db:5432/infotrack_dev
      DB_INFOSTARS_PSQL_USER: infostars_u
      DB_INFOSTARS_PSQL_PASSWORD: test
      DB_LIQUIBASE_UPGRADE_DISABLED: "true"
      LIVE_JMSURI: tcp://activemq:61616
      ACTIVEMQ_ENABLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_GOOGLE_MAPS_API_KEY: ${FRONTEND_GOOGLE_MAPS_API_KEY}
      GEOSERVICEGOOGLE_APIKEY: ${GEOSERVICEGOOGLE_APIKEY}
      GEOSERVICELOCATIONIQ_APIKEY: ${GEOSERVICELOCATIONIQ_APIKEY}
    volumes:
      - ./data/checkout:/work/checkout
      - ./box-mounts:/work/box-mounts
      - ./data/claude:/home/gradle/.claude
      - ./data/pinchtab:/home/gradle/.pinchtab
      - ./git-identity:/home/gradle/.gitidentity
      # Jenkins' pre-populated Maven cache, mounted READ-ONLY at the hub user's default local repo
      # (~/.m2/repository, since the hub runs as uid 1000 with HOME=/home/gradle). Maven/gradle then
      # resolve dependencies from Jenkins' cache without re-downloading; read-only so a build can
      # never mutate the shared cache. Host path is overridable via MAVEN_REPO_HOST in .env.
      - ${MAVEN_REPO_HOST:-/var/jenkins_home/.m2/repository}:/home/gradle/.m2/repository:ro
    restart: unless-stopped
