# Per-project remote claude-box stack. Copy this directory once per project (each gets its own
# .env, box-mounts, and ./data), then `docker compose up -d`.
#
# All images are pulled from the acoveo registry (dockerregistry.acoveo.com) by default, so the
# stack does NOT need to run on the same host as Jenkins. The db (dbtest) and the box / hub /
# box-broker images are built + pushed by the Jenkinsfile; here they're referenced by the *_IMAGE
# vars in .env and pulled per COMPOSE_PULL_POLICY (default `missing`). `docker login
# dockerregistry.acoveo.com` must have run on the host. To build hub + box-broker locally instead
# (e.g. on the Jenkins host), set COMPOSE_PULL_POLICY=build.
#
# Model: the hub owns the checkout and runs the dev services on demand (cbx up backend|frontend|
# pinchtab). Agent boxes are SEPARATE claude-box containers spawned by the box-broker (the only
# holder of the docker socket); they mount only what box-mounts grants and reach the hub by name.
#
# Model: the hub owns the checkout and runs the dev services on demand (cbx up backend|frontend|
# pinchtab). Agent boxes are SEPARATE claude-box containers spawned by the box-broker (the only
# holder of the docker socket); they mount only what box-mounts grants and reach the hub by name.

name: ${PROJECT_NAME}

networks:
  default:
    name: cbx-${PROJECT_NAME}

services:
  db:
    image: ${DB_IMAGE:-dockerregistry.acoveo.com/infostars/dbtest:latest}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    restart: unless-stopped

  activemq:
    image: apache/activemq-artemis:latest
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  # The ONLY container with the docker socket. "claude-box.sh as a service": validates the request
  # (box name + box-mounts, sources confined under the checkout) then runs the modified claude-box.sh.
  box-broker:
    # Pulled from the acoveo registry if missing (COMPOSE_PULL_POLICY=missing). Set
    # COMPOSE_PULL_POLICY=build to (re)build locally from this dir instead (e.g. on the Jenkins host).
    image: ${BOX_BROKER_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-broker:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: box-broker/Dockerfile
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN}
      PROJECT_NAME: ${PROJECT_NAME}
      BOX_IMAGE: ${BOX_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-infostars:stable}
      BOX_NETWORK: cbx-${PROJECT_NAME}
      # The prepared "golden" checkouts every box overlays (data/golden/current), and the staging dir
      # the hub prepares a new one in before the broker seals it into place. PROJECT_ROOT confines the
      # EXTRA mounts from box-mounts; the checkout itself is the overlay volume, not a bind.
      GOLDEN_DIR: ${STACK_DIR}/data/golden
      GOLDEN_STAGING: ${STACK_DIR}/data/golden-staging
      PROJECT_ROOT: ${STACK_DIR}/data/golden
      CHECKOUT_DST: /home/dev/checkout
      DEV_BRANCH: ${DEV_BRANCH:-dev}
      HUB_GIT_URL: ${HUB_GIT_URL:-git://hub/repo}
      CLAUDE_HOME: ${STACK_DIR}/data/claude
      # Shared package caches mounted rw into every box (and the hub) at ~/.npm and ~/.gradle, so
      # node/gradle artifacts are downloaded once instead of duplicated per box.
      NPM_CACHE: ${STACK_DIR}/data/npm-cache
      GRADLE_CACHE: ${STACK_DIR}/data/gradle-cache
      BOXROOT: ${STACK_DIR}/data/boxes
      BOX_MOUNTS: ${STACK_DIR}/box-mounts
      PINCHTAB_SERVER: http://hub:9867
      PINCHTAB_TOKEN: ${PT_TOKEN}
      # Per-project port forwards (like box-mounts): NAME BOX_PORT HUB_BASE_PORT per line. Each box
      # gets a slot N and every forward is published on the hub at 127.0.0.1:(HUB_BASE_PORT + N).
      PORT_FORWARDS_FILE: ${STACK_DIR}/port-forwards
      PORT_FORWARD_SLOTS: ${PORT_FORWARD_SLOTS:-16}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # host paths must resolve identically inside the broker so the boxes' -v binds land on the host
      - ${STACK_DIR}:${STACK_DIR}
    restart: unless-stopped

  # The "hosting dev environment": owns the checkout + git identity, runs backend/ng serve/pinchtab
  # on demand, hosts YOUR commit workflow. Does NOT run claude.
  hub:
    # Same policy as box-broker: pulled from the acoveo registry if missing
    image: ${HUB_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-hub:stable}
    pull_policy: ${COMPOSE_PULL_POLICY:-missing}
    build:
      # The hub image = the shared Dockerfile.addon (JDK/gradle/ant via build-setup.sh) layered onto
      # claude-box-hub-base (hub/Dockerfile.base). Same add-on file the box uses; FINAL_USER=1000 keeps
      # the hub running as its uid-1000 'dev' user. A local build (COMPOSE_PULL_POLICY=build) resolves
      # the base from the registry by default; point BASE_IMAGE at a locally-built tag to build offline
      # (build hub/Dockerfile.base first — see README-remote.md).
      context: .
      dockerfile: Dockerfile.addon
      args:
        BASE_IMAGE: ${HUB_BASE_IMAGE:-dockerregistry.acoveo.com/acoveo/claude-box-hub-base:stable}
        FINAL_USER: "1000"
    hostname: ${PROJECT_NAME}-hub
    init: true
    depends_on: [db, redis, box-broker]
    environment:
      # The hub's own repo: the only clone with origin credentials, the only place dev is merged, and
      # what the boxes fetch/push over git:// (see hub/entrypoint.sh).
      CHECKOUT: /work/repo
      REPO_URL: ${REPO_URL}
      DEV_BRANCH: ${DEV_BRANCH:-dev}
      HUB_GIT_URL: ${HUB_GIT_URL:-git://hub/repo}
      GOLDEN_DIR: /work/golden
      GOLDEN_STAGING: /work/golden-staging
      # Run inside a staged golden by `cbx golden refresh` to make it ready-to-build. This is the
      # expensive setup the boxes then inherit for free — put your project's install/warm steps here.
      GOLDEN_PREP_CMD: ${GOLDEN_PREP_CMD:-npm --prefix infostarsFrontend ci}
      BROKER_URL: http://box-broker:8099
      BROKER_TOKEN: ${BROKER_TOKEN}
      BOX_MOUNTS: /work/box-mounts
      GIT_CONFIG_GLOBAL: /home/dev/.gitidentity/gitconfig
      # backend wiring (confirmed keys; env overrides the baked-in config.properties defaults)
      DB_INFOSTARS_PSQL_URL: jdbc:postgresql://db:5432/infotrack_dev
      DB_INFOSTARS_PSQL_USER: infostars_u
      DB_INFOSTARS_PSQL_PASSWORD: test
      DB_LIQUIBASE_UPGRADE_DISABLED: "true"
      LIVE_JMSURI: tcp://activemq:61616
      ACTIVEMQ_ENABLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_GOOGLE_MAPS_API_KEY: ${FRONTEND_GOOGLE_MAPS_API_KEY}
      GEOSERVICEGOOGLE_APIKEY: ${GEOSERVICEGOOGLE_APIKEY}
      GEOSERVICELOCATIONIQ_APIKEY: ${GEOSERVICELOCATIONIQ_APIKEY}
    volumes:
      - ./data/repo:/work/repo
      # Sealed goldens are READ-ONLY here on purpose. It cannot be done with file modes: overlayfs
      # checks write permission on the merged inode BEFORE deciding to copy up, so a non-writable
      # golden would make every file unwritable inside the boxes. The mount is the enforcement; the
      # hub prepares new goldens in the writable staging dir and the broker moves them into place.
      - ./data/golden:/work/golden:ro
      - ./data/golden-staging:/work/golden-staging
      # Per-box state (which golden, session id, upper layer) — readable for `cbx q`/diagnostics only.
      - ./data/boxes:/work/boxes:ro
      - ./box-mounts:/work/box-mounts
      - ./data/claude:/home/dev/.claude
      - ./data/pinchtab:/home/dev/.pinchtab
      - ./git-identity:/home/dev/.gitidentity
      # Shared package caches — the SAME dirs the broker mounts into every box (~/.npm, ~/.gradle) —
      # so the hub and all boxes download node/gradle artifacts once instead of duplicating them.
      - ./data/npm-cache:/home/dev/.npm
      - ./data/gradle-cache:/home/dev/.gradle
      # Jenkins' pre-populated Maven cache, mounted READ-ONLY at the hub user's default local repo
      # (~/.m2/repository, since the hub runs as uid 1000 with HOME=/home/dev). Maven/gradle then
      # resolve dependencies from Jenkins' cache without re-downloading; read-only so a build can
      # never mutate the shared cache. Host path is overridable via MAVEN_REPO_HOST in .env.
      - ${MAVEN_REPO_HOST:-/var/jenkins_home/.m2/repository}:/home/dev/.m2/repository:ro
    restart: unless-stopped
