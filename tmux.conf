# tmux config for the claude-box + hub images. common-setup.sh installs this to /etc/tmux.conf (the
# SYSTEM config, read by tmux for every user) — the box's /home is a bind-mount, so a per-user
# ~/.tmux.conf there would be shadowed. Add more settings below as needed.

# Mouse mode: scroll, click-to-select panes/windows, drag-to-resize.
set -g mouse on
