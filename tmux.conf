# tmux config for the claude-box + hub images. common-setup.sh installs this to /etc/tmux.conf (the
# SYSTEM config, read by tmux for every user) — the box's /home is a bind-mount, so a per-user
# ~/.tmux.conf there would be shadowed. Add more settings below as needed.
#
# Goal: `cbxbox <name>` should feel like running claude in a plain terminal. Debian trixie ships
# tmux 3.5a, so everything below is available without a backport.

# Mouse mode: scroll, click-to-select panes/windows, drag-to-resize.
#
# The cost of `on`: tmux puts the terminal into mouse-reporting mode, so YOUR terminal never sees a
# plain drag or middle click — no X PRIMARY selection, no middle-click paste of it. That is not
# fixable from here; the two are mutually exclusive at the protocol level. Hold SHIFT to bypass
# mouse reporting and get the native behaviour back (standard in ghostty/xterm/gnome-terminal/…):
#   Shift+drag          -> X PRIMARY selection
#   Shift+middle-click  -> paste X PRIMARY
#   Ctrl+Shift+C / +V   -> terminal clipboard (never touches tmux at all)
set -g mouse on

# Do NOT let tmux write your laptop clipboard itself. Default `on` makes every mouse drag-select
# fire an OSC 52 to the outer terminal, silently overwriting whatever you had copied. `external`
# keeps tmux's own copies in the tmux paste buffer only, while still FORWARDING OSC 52 emitted by
# the application inside the pane (claude's own copy) — so clipboard becomes a deliberate act.
set -g set-clipboard external

# Middle-click pastes the tmux paste buffer (what a mouse drag-select just filled). Without this,
# middle click inside a mouse-mode pane does nothing at all. -p = bracketed paste, so claude sees it
# as pasted text rather than a burst of keystrokes. For the X PRIMARY selection use Shift+middle.
bind -n MouseDown2Pane paste-buffer -p

# Shift+Enter (newline in claude's prompt instead of submit). The terminal encodes it as an extended
# key (CSI 13;2u); tmux drops those unless extended keys are enabled in BOTH directions:
#   extended-keys on      — forward the extended key to the application when it asks for them
#   terminal-features …   — tell tmux the OUTER terminal can produce them, so it turns them on there
# extended-keys is a SERVER option, hence `set -s`. `on` forwards them only to an application that
# ASKED for them; if Shift+Enter still submits, escalate to `always` (forwards unconditionally — the
# reason it is not the default here is that it also reshapes modified keys for apps that never asked).
set -s extended-keys on
# (the pattern is matched against TERM — 'xterm*' already covers xterm-ghostty.)
set -as terminal-features 'xterm*:extkeys'

# Scrollback with Shift-PageUp / Shift-PageDown, like a plain terminal. tmux's scrollback lives in
# copy mode, so S-PageUp has to enter it first (-u = already scrolled one page up); -e makes copy
# mode exit by itself once S-PageDown reaches the bottom, so you never have to press q.
# The in-copy-mode bindings are needed in both key tables (emacs is the default, vi if mode-keys
# is ever switched) — otherwise the second S-PageUp would be unbound.
bind -n S-PageUp copy-mode -eu
bind -T copy-mode    S-PageUp   send -X page-up
bind -T copy-mode    S-PageDown send -X page-down
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

# A terminal-sized scrollback: the 2000-line default loses the start of a long claude run.
set -g history-limit 50000
